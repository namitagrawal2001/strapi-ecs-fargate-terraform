name: Deploy Strapi ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply (create infra including ECR)
        run: terraform apply -auto-approve -var="image_tag=${{ env.IMAGE_TAG }}"
        working-directory: terraform

      - name: Get ECR repo URL
        run: |
          ECR_URL=$(terraform output -raw ecr_repo_url)
          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV
        working-directory: terraform

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t $ECR_URL:${{ env.IMAGE_TAG }} ./app

      - name: Push Docker image
        run: docker push $ECR_URL:${{ env.IMAGE_TAG }}

      - name: Terraform Apply (update ECS with image)
        run: terraform apply -auto-approve -var="image_tag=${{ env.IMAGE_TAG }}"
        working-directory: terraform
