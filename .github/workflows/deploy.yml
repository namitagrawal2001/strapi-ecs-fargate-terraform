name: Deploy Strapi ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t strapi ./app

      - name: Tag image
        run: docker tag strapi:latest 663959447043.dkr.ecr.ap-south-1.amazonaws.com/strapi-ecs:latest

      - name: Push image
        run: docker push 663959447043.dkr.ecr.ap-south-1.amazonaws.com/strapi-ecs:latest

      - name: Restart ECS
        run: |
          aws ecs update-service \
            --cluster strapi-cluster \
            --service strapi-service \
            --force-new-deployment \
            --region ap-south-1
